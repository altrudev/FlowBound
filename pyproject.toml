[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowbound"
version = "0.1.0"
description = "Governed multi-agent runtime for bounded state transitions"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=1.29.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
