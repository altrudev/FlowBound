[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowbound"
version = "0.2.0"
description = "Governed multi-agent execution for bounded state transitions"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "google-adk>=1.29.0",
  "google-cloud-firestore>=2.28.1",
  "google-cloud-pubsub>=2.39.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
